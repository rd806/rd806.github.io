<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>GeoGebra</title>
    <style>
        /* GeoGebra 展示页：除了顶部一条细栏，其余空间全部留给 applet。
           纯静态文件，不走 Hugo 模板，样式自理。 */
        :root {
            --bar-height: 2.75rem;
            --border: #e3e3e3;
            --text: #1f1f1f;
            --muted: #6b7280;
            --accent: #2d70b3;
            --spinner-track: #e5e7eb;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            background: #fff;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        .bar {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            height: var(--bar-height);
            padding: 0 0.9rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        .bar a {
            color: var(--accent);
            text-decoration: none;
            white-space: nowrap;
        }

        .bar a:hover {
            text-decoration: underline;
        }

        #title {
            color: var(--muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 舞台占满剩余空间，applet 铺满舞台 */
        .stage {
            position: relative;
            flex: 1 1 auto;
            min-height: 0;
        }

        #applet,
        .msg {
            position: absolute;
            inset: 0;
        }

        .msg {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--muted);
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--spinner-track);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .spinner {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <div class="bar">
        <a href="#" id="back">← 返回</a>
        <span id="title">GeoGebra</span>
    </div>

    <div class="stage">
        <div id="applet"></div>
        <div class="msg" id="msg">
            <div class="spinner"></div>
            <span>正在加载 GeoGebra…</span>
        </div>
    </div>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var id = params.get('id') || '';
            var src = params.get('src') || '';
            var app = params.get('app') || '';
            var view = params.get('view') || '';
            var name = params.get('name') || '';

            var stage = document.getElementById('applet');
            var msg = document.getElementById('msg');
            var titleEl = document.getElementById('title');

            var ggbApi = null;

            document.title = name || ('GeoGebra' + (id ? ' · ' + id : ''));
            titleEl.textContent = document.title;

            // 返回：新标签页打开时没有可回退的历史，就回站点首页
            document.getElementById('back').addEventListener('click', function (event) {
                event.preventDefault();
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.location.href = '/';
                }
            });

            function fail(text) {
                while (msg.firstChild) {
                    msg.removeChild(msg.firstChild);
                }
                msg.appendChild(document.createTextNode(text));
            }

            if (!id && !src) {
                fail('地址里缺少 id 或 src 参数，无法确定要显示哪个 GeoGebra 内容。');
                return;
            }

            /* 只给窗口尺寸和界面开关：app 类型与视图布局默认沿用材料自身的设置，
               这样整屏看到的就是作者在 GeoGebra 里设计的样子 */
            var ggbParams = {
                showToolBar: true,
                showMenuBar: false,
                showResetIcon: true,
                enableShiftDragZoom: true,
                enableRightClick: false,
                errorDialogsActive: false,
                useBrowserForJS: false,
                appletOnLoad: function (api) {
                    ggbApi = api;
                    if (msg.parentNode) {
                        msg.parentNode.removeChild(msg);
                    }
                }
            };

            if (id) {
                ggbParams.material_id = id;
            }
            if (src) {
                ggbParams.filename = src;
            }
            if (app) {
                ggbParams.appName = app;
            }
            if (view) {
                ggbParams.perspective = view;
            }

            // 界面语言跟随浏览器，识别不到就用 zh_CN
            var lang = (navigator.language || '').toLowerCase();
            if (lang.indexOf('zh') === 0) {
                ggbParams.language = (lang.indexOf('tw') !== -1 || lang.indexOf('hk') !== -1) ? 'zh_TW' : 'zh_CN';
            } else if (lang) {
                ggbParams.language = lang.split('-')[0];
            } else {
                ggbParams.language = 'zh_CN';
            }

            ggbParams.width = stage.clientWidth || window.innerWidth;
            ggbParams.height = stage.clientHeight || window.innerHeight;

            var script = document.createElement('script');
            script.src = 'https://www.geogebra.org/apps/deployggb.js';

            script.onload = function () {
                new GGBApplet(ggbParams, true).inject('applet');

                /* applet 的像素尺寸是初始化时量到的。之后舞台尺寸若变化
                   （拖动窗口、移动端地址栏收放、分屏），必须用 setSize 同步，
                   否则 applet 会停在旧尺寸、旁边留白。 */
                if (typeof ResizeObserver === 'function') {
                    var lastWidth = 0;
                    var lastHeight = 0;
                    var timer = null;

                    new ResizeObserver(function () {
                        var width = stage.clientWidth;
                        var height = stage.clientHeight;

                        // 尺寸没变就跳过，也避免 setSize 反过来触发观察器形成死循环
                        if (width === lastWidth && height === lastHeight) {
                            return;
                        }
                        lastWidth = width;
                        lastHeight = height;

                        if (!ggbApi || width <= 0 || height <= 0) {
                            return;
                        }

                        clearTimeout(timer);
                        timer = setTimeout(function () {
                            ggbApi.setSize(width, height);
                        }, 150);
                    }).observe(stage);
                }
            };

            script.onerror = function () {
                fail('GeoGebra 脚本加载失败，请检查网络连接后刷新重试。');
            };

            document.head.appendChild(script);
        })();
    </script>
</body>
</html>
